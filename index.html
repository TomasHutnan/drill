<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Drill</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='m9 17 5 5 9-11' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      try { document.documentElement.dataset.theme = JSON.parse(localStorage['drill.theme']); } catch {}
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <a class="brand" href="#/">Drill</a>
      <div class="nav-actions">
        <button id="backup" class="icon" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 4v11m-4-4 4 4 4-4M4 19h16" /></svg>
        </button>
        <button id="restore" class="icon" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M4 19h16" /></svg>
        </button>
        <input id="restore-file" type="file" accept=".json,application/json" hidden />
        <button id="theme" class="icon" type="button">
          <svg class="theme-system" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" /></svg>
          <svg class="theme-light" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="theme-dark" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" /></svg>
        </button>
        <label id="lang-label" class="icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" /></svg>
          <select id="lang"></select>
        </label>
      </div>
    </nav>
    <main></main>
  </body>
</html>
